<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador Mega-Sena</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b5e20">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎯 Gerador Mega-Sena</h1>
    <button id="btnTema" title="Alternar tema">🌙</button>
</header>

<div class="card">
    <label title="Quantidade de apostas que serão geradas">
        Quantidade de jogos
    </label>
    <input type="number" id="qtdJogos" value="10" min="1">

    <label title="Quantidade de dezenas em cada jogo (entre 6 e 20)">
        Números por jogo (6–20)
    </label>
    <input type="number" id="qtdNumeros" value="6" min="6" max="20">

    <label title="Valor mínimo permitido para a soma das dezenas do jogo">
        Soma mínima
    </label>
    <input type="number" id="sumMin" value="120">

    <label title="Valor máximo permitido para a soma das dezenas do jogo">
        Soma máxima
    </label>
    <input type="number" id="sumMax" value="210">

    <label title="Quantidade ideal de números pares no jogo">
        Pares alvo
    </label>
    <input type="number" id="pares" value="3">

    <label title="Margem de variação permitida para a quantidade de pares">
        Tolerância
    </label>
    <input type="number" id="tolerancia" value="1">

    <label class="check"
           title="Se marcado, mostra todas as combinações possíveis de 6 números a partir do jogo gerado">
        <input type="checkbox" id="desdobramento">
        Mostrar desdobramento lógico
    </label>

    <button id="btnGerar">Gerar jogos</button>
    <button id="btnCopiar">Copiar</button>
</div>

<pre id="resultado"></pre>

</body>
</html>
