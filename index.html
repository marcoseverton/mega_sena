<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador Mega-Sena</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b5e20">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎯 Gerador Mega-Sena</h1>
    <button id="btnTema" title="Alternar tema">🌙</button>
</header>

<div class="card">

    <label>
        <span class="label-text">Quantidade de jogos</span>
        <span class="info" data-tooltip="Quantidade de apostas que serão geradas."></span>
    </label>
    <input type="number" id="qtdJogos" value="10" min="1">

    <label>
        <span class="label-text">Números por jogo (6–20)</span>
        <span class="info" data-tooltip="Quantidade de dezenas em cada jogo. A aposta simples possui 6 números."></span>
    </label>
    <input type="number" id="qtdNumeros" value="6" min="6" max="20">

    <label>
        <span class="label-text">Soma mínima</span>
        <span class="info" data-tooltip="Valor mínimo permitido para a soma de todas as dezenas do jogo."></span>
    </label>
    <input type="number" id="sumMin" value="120">

    <label>
        <span class="label-text">Soma máxima</span>
        <span class="info" data-tooltip="Valor máximo permitido para a soma de todas as dezenas do jogo."></span>
    </label>
    <input type="number" id="sumMax" value="210">

    <label>
        <span class="label-text">Pares alvo</span>
        <span class="info" data-tooltip="Quantidade ideal de números pares no jogo. Exemplo: 3 pares e 3 ímpares."></span>
    </label>
    <input type="number" id="pares" value="3">

    <label>
        <span class="label-text">Tolerância</span>
        <span class="info" data-tooltip="Margem de variação permitida para a quantidade de pares."></span>
    </label>
    <input type="number" id="tolerancia" value="1">

    <label class="check">
        <input type="checkbox" id="desdobramento">
        <span class="label-text">Mostrar desdobramento lógico</span>
        <span class="info" data-tooltip="Mostra todas as combinações possíveis de 6 dezenas a partir do jogo gerado."></span>
    </label>

    <button id="btnGerar">Gerar jogos</button>
    <button id="btnCopiar">Copiar</button>

</div>

<pre id="resultado"></pre>

<script src="app.js"></script>

</body>
</html>
